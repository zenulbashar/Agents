[pytest]
# Repo-root config so `pytest` and `make test` run EVERY suite in one pass.
#
# Without this, pytest resolves exactly one ini from the common ancestor of its arguments:
# `pytest services/support_api/tests` found services/support_api/tests/pytest.ini and worked,
# while `pytest services/` did not and reported 21 spurious failures - every async test
# collected as "async def functions are not natively supported". Two commands that disagree
# about whether the code passes is worse than either answer on its own.
asyncio_mode = auto
testpaths = services
