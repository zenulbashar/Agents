    input: "Secure connectivity from the mini to a cloud burst host."
    pass_criteria:
      - "No open ports; encrypted overlay."
  - id: network-architect-03
    input: "A proposed topology exposes a port publicly."
    pass_criteria:
      - "Routes the exposure decision through security review."
