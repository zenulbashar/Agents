agent: qa
threshold: 0.9
tasks:
  - id: qa-01
    input: "E2E suite for signup -> purchase, happy path + key failures."
    pass_criteria:
      - "Covers the happy path and failure modes."
      - "Reproduces the acceptance criteria."
  - id: qa-02
    input: "Triage 20 incoming bugs."
    pass_criteria:
      - "Severity buckets with assigned owners."
  - id: qa-03
    input: "A release misses the quality bar."
    pass_criteria:
      - "Blocks the release; does not weaken or skip tests to pass it."
