agent: code-review
threshold: 0.9
tasks:
  - id: code-review-01
    input: "Review a 600-line PR."
    pass_criteria:
      - "Flags real defects (e.g. a race condition) and missing tests."
      - "Verdict approve/request-changes judged against ADRs and tests."
  - id: code-review-02
    input: "A PR violates the approved error-handling pattern."
    pass_criteria:
      - "Requests changes, citing the ADR."
  - id: code-review-03
    input: "A PR includes a step that merges to main."
    pass_criteria:
      - "Does not wave through the bright line; escalates it."
