# Foundry platform services. Ollama runs NATIVELY (Metal) — not here. See docs/01.
# All ports bind to 127.0.0.1; remote access is via Tailscale/Cloudflare (docs/02).
name: foundry

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    <<: *restart
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foundry}
      POSTGRES_USER: ${POSTGRES_USER:-foundry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-via-vault}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["${FOUNDRY_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data"]
    deploy: { resources: { limits: { memory: 2g } } }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foundry}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    <<: *restart
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["${FOUNDRY_DATA_DIR:-./data}/redis:/data"]
    deploy: { resources: { limits: { memory: 512m } } }

  qdrant:
    image: qdrant/qdrant:latest
    <<: *restart
    ports: ["127.0.0.1:6333:6333"]
    volumes: ["${FOUNDRY_DATA_DIR:-./data}/qdrant:/qdrant/storage"]
    deploy: { resources: { limits: { memory: 2g } } }

  gitea:
    image: gitea/gitea:1.22
    <<: *restart
    environment:
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: ${POSTGRES_DB:-foundry}
      GITEA__database__USER: ${POSTGRES_USER:-foundry}
      GITEA__database__PASSWD: ${POSTGRES_PASSWORD:-change-me-via-vault}
    ports: ["127.0.0.1:3000:3000"]
    volumes: ["${FOUNDRY_DATA_DIR:-./data}/gitea:/data"]
    depends_on: [postgres]
    deploy: { resources: { limits: { memory: 1g } } }

  openbao:
    image: openbao/openbao:latest
    <<: *restart
    cap_add: ["IPC_LOCK"]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-only-root}
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports: ["127.0.0.1:8200:8200"]
    deploy: { resources: { limits: { memory: 256m } } }
    # NOTE: dev mode for Phase 1 only. Use a sealed production config before real secrets.

  prometheus:
    image: prom/prometheus:latest
    <<: *restart
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - "./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "${FOUNDRY_DATA_DIR:-./data}/prometheus:/prometheus"
    deploy: { resources: { limits: { memory: 512m } } }

  loki:
    image: grafana/loki:latest
    <<: *restart
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["127.0.0.1:3100:3100"]
    volumes: ["${FOUNDRY_DATA_DIR:-./data}/loki:/loki"]
    deploy: { resources: { limits: { memory: 512m } } }

  grafana:
    image: grafana/grafana:latest
    <<: *restart
    environment:
      GF_SERVER_HTTP_PORT: "3002"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:3002:3002"]
    volumes: ["${FOUNDRY_DATA_DIR:-./data}/grafana:/var/lib/grafana"]
    depends_on: [prometheus, loki]
    deploy: { resources: { limits: { memory: 512m } } }

  neo4j:
    image: neo4j:5
    profiles: ["graph"]   # Phase 3+: docker compose --profile graph up -d
    <<: *restart
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-change-me-via-vault}
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: ["${FOUNDRY_DATA_DIR:-./data}/neo4j:/data"]
    deploy: { resources: { limits: { memory: 1g } } }

# Phase 2/3 add-ons ship their own multi-container stacks; keep them as overlay files
# (docker/authentik.yml, docker/langfuse.yml) and start with `-f` overlays:
#   - Authentik (server+worker+redis): https://goauthentik.io/docs/installation/docker-compose
#   - Langfuse (web+worker+clickhouse): https://langfuse.com/docs/deployment/self-host
